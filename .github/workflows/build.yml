name: Build WiFi Guard APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract WiFi Guard project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q WiFiGuard_GitHub_Project.zip -d buildsrc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build WiFi Guard APK
        run: gradle -p buildsrc/WiFiGuard :app:assembleDebug --stacktrace

      - name: Upload WiFi Guard APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiGuard-debug
          path: buildsrc/WiFiGuard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
